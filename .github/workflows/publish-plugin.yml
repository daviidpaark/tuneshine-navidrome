name: Build and Publish Navidrome Plugin

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and release"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Test, Package, and Release
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - name: Verify tag matches manifest and CHANGELOG
        run: |
          version=$(jq -r .version manifest.json)
          if [ "v$version" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match manifest.json version $version"
            exit 1
          fi
          if ! grep -qF "## [$version]" CHANGELOG.md; then
            echo "::error::No CHANGELOG.md section for $version"
            exit 1
          fi

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests
        run: go test ./...

      - name: Build and package plugin
        run: make package

      - name: Prepare release title and notes
        id: notes
        run: |
          git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
          title=$(git tag -l --format='%(contents:subject)' "$TAG" | sed -nE 's/^Release (v[^:]+): (.)/\1 - \u\2/p')
          echo "title=${title:-$TAG}" >> "$GITHUB_OUTPUT"
          awk -v v="## [${TAG#v}]" 'index($0, v) == 1 {f = 1; next} f && /^## \[/ {exit} f && !/^---\r?$/' CHANGELOG.md > release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.TAG }}
          name: ${{ steps.notes.outputs.title }}
          body_path: release-notes.md
          files: tuneshine.ndp
